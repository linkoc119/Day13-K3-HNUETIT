alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency.p95 > 3000ms for 5 minutes
    type: symptom-based
    owner: observability
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: errors.error_rate_pct > 2 for 5 minutes
    type: symptom-based
    owner: api
    runbook: docs/alerts.md#alert-2
  - name: quality_score_drop
    severity: warning
    condition: quality.mean < 0.75 for 10 minutes
    type: symptom-based
    owner: ai-quality
    runbook: docs/alerts.md#alert-3
